        document.documentElement.lang = "de";
        document.documentElement.dataset.language = "de";
      }
    } catch (e) {}

  <link rel="stylesheet" href="/shared/hub/hub.css" />

<body
  class="realm-hub"
  data-title-en="Flo Fischer"
  data-title-de="Flo Fischer"
>
  <canvas id="hub-world" aria-label="Split landscape between Seele and Gehirn"></canvas>

  <div class="film-grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="fade-veil" data-fade></div>
  <div class="boot-fade" data-boot></div>

  <a class="skip-link" href="#fallback-nav">
    <span data-lang-copy="en">Skip to links</span>
    <span data-lang-copy="de">Zu den Links</span>
  </a>

  <header class="hud" data-hud>
    <a class="hud-mark" href="/">flo fischer</a>
    <p class="hud-zone" data-zone>Seele · Gehirn</p>
    <nav class="hud-nav" aria-label="Site" id="fallback-nav">
      <a href="https://seele.flofischer.org/" data-local="/__seele/">Seele</a>
      <a href="https://gehirn.flofischer.org/" data-local="/__gehirn/">Gehirn</a>
      <a
        class="mode-link"
        href="/diorama/"
        data-local="/__root/diorama/"
        aria-label="02 — open the freely rotatable 3D diorama version"
        title="3D Diorama"
      >02</a>
      <div class="language-switch" role="group" aria-label="Language / Sprache">
        <button type="button" data-language-button="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language-button="de" aria-pressed="false">DE</button>
      </div>
      <button type="button" class="mute" data-mute aria-pressed="false" title="Sound">
        <span data-lang-copy="en">Sound</span>
        <span data-lang-copy="de">Ton</span>
      </button>
    </nav>
  </header>

  <p class="hint" data-hint>
    <span data-lang-copy="en">Drag to look · click a threshold to enter</span>
    <span data-lang-copy="de">Ziehen zum Umschauen · Schwelle anklicken zum Eintreten</span>
  </p>

  <button type="button" class="prompt" data-prompt hidden>
    <span data-prompt-kicker></span>
    <strong data-prompt-title></strong>
    <em data-prompt-action></em>
  </button>

  <noscript>
    <div class="noscript">
      <p>Seele · Gehirn</p>
      <p><a href="https://seele.flofischer.org/">seele.flofischer.org</a></p>
      <p><a href="https://gehirn.flofischer.org/">gehirn.flofischer.org</a></p>
      <p><a href="/diorama/">3D Diorama</a></p>
    </div>
  </noscript>

  <script type="module" src="/shared/hub/main.js"></script>
  <script src="/shared/pwa.js" defer></script>

</html>
