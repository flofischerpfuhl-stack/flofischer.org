<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Florian Fischer — Seele und Gehirn." />
  <title>Flo Fischer</title>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='16' height='32' fill='%23123a7a'/%3E%3Crect x='16' width='16' height='32' fill='%23b01020'/%3E%3C/svg%3E" />
</head>
<body class="portal">
  <div class="portal-mark">flofischer.org</div>
  <main class="portal-grid">
    <a class="seele" href="https://seele.flofischer.org/" data-local="/__seele/">
      <h1 class="name">Seele</h1>
      <p class="sub">Apologetik</p>
    </a>
    <a class="gehirn" href="https://gehirn.flofischer.org/" data-local="/__gehirn/">
      <h1 class="name">Gehirn</h1>
      <p class="sub">Projekte</p>
    </a>
  </main>
  <script>
    if (/localhost|127\.0\.0\.1|workers\.dev/.test(location.hostname)) {
      document.querySelectorAll("a[data-local]").forEach((a) => {
        a.href = a.dataset.local;
      });
    }
  </script>
</body>
</html>
