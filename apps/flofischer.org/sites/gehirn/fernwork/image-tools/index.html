<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Edit image · Fernwork</title>
<link rel="icon" href="../kit/img/logo.svg" type="image/svg+xml">
<script src="../kit/theme-init.js"></script>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/components.css">
<link rel="stylesheet" href="lightbox.css">
</head>
<body>
<!-- Images · "Lightbox" workspace (archetype A). URL: ?leaf=image-edit|image-markup|image-inspect|image-export|remove-background|image-ocr|compress-image…  &demo=1 loads the sample shoot. -->
<main id="main">
  <div class="fw-workbench lb is-empty" id="wb" data-mode="edit">
    <div class="fw-framebar lb-framebar" role="toolbar" aria-label="Image" id="framebar"></div>
    <div class="lb-main has-inspector" id="lb-main">
      <div class="fw-stage lb-stage" id="stage" tabindex="0" aria-label="Image canvas" aria-describedby="stage-desc">
        <p class="fw-sr" id="stage-desc">Arrow keys switch photos. F fits, 1 shows 100 %, backslash compares.</p>
        <div class="lb-view" id="view">
          <canvas class="lb-canvas" id="cv" aria-hidden="true"></canvas>
          <canvas class="lb-canvas lb-canvas--old" id="cv-old" aria-hidden="true"></canvas>
          <img class="lb-after" id="after" alt="" hidden>
          <div class="lb-ocr" id="ocr" hidden></div>
          <svg class="lb-draft" id="draft" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="lb-crop" id="crop" hidden></div>
          <div class="lb-scan" id="scan" hidden></div>
        </div>
        <div class="lb-split" id="split" hidden></div>
        <div class="lb-brush" id="brush" hidden></div>
        <div class="lb-hud" id="hud"></div>
        <button class="lb-holdcmp" type="button" id="m-compare" aria-label="Hold to compare with the original" aria-pressed="false"></button>
        <div class="lb-empty" id="empty"></div>
      </div>
      <aside class="fw-inspector lb-panel" aria-label="Inspector" id="panel"></aside>
    </div>
    <div class="lb-dock" id="dock"></div>
    <div class="lb-mbar" id="mbar"></div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
