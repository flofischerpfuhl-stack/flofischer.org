<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Open file · Fernwork</title>
<link rel="icon" href="../kit/img/logo.svg" type="image/svg+xml">
<script src="../kit/theme-init.js"></script>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/components.css">
<link rel="stylesheet" href="viewers.css">
</head>
<body>
<!-- Open · universal viewer (archetype A, Workbench). Every file opens as a document tab in one shared frame.
     URL: ?open=grundriss.dxf,kunden.sqlite (samples) · ?fresh (forget this browser's session) · ?leaf=dxf-viewer … -->
<main id="main">
  <div class="fw-workbench ov is-empty" id="wb">
    <div class="fw-framebar ov-framebar" role="toolbar" aria-label="Document" id="framebar"></div>
    <div class="fw-wb-main ov-main" id="wb-main">
      <aside class="fw-wb-list ov-list" id="list"></aside>
      <div class="fw-stage ov-stage" id="stage">
        <div class="ov-docs" id="docs"></div>
        <div class="ov-empty" id="empty"></div>
        <div class="fw-zoom ov-zoom" role="group" aria-label="Zoom" id="zoom" hidden></div>
      </div>
      <aside class="fw-inspector ov-insp" aria-label="Inspector" id="inspector"></aside>
    </div>
    <div class="fw-statusbar ov-status" id="status"></div>
    <nav class="fw-bottombar ov-bottombar" aria-label="Document tools" id="bottombar"></nav>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
