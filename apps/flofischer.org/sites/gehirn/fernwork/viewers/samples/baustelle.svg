<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, Arial, sans-serif">
  <title>Baustelle Lindenstraße · Kanalsanierung</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a5a"/>
      <stop offset="1" stop-color="#7a5532"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/>
      <stop offset="1" stop-color="#5d6670"/>
    </linearGradient>
    <pattern id="gravel" width="14" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#8d6a45"/>
      <circle cx="10" cy="7" r="1.2" fill="#a07a50"/>
    </pattern>
  </defs>
  <rect width="800" height="300" fill="url(#sky)"/>
  <circle cx="420" cy="70" r="34" fill="#ffd25e"/>
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="160" cy="70" rx="56" ry="18"/>
    <ellipse cx="200" cy="60" rx="40" ry="20"/>
    <ellipse cx="500" cy="120" rx="48" ry="14"/>
  </g>
  <!-- ground and trench -->
  <rect y="300" width="800" height="200" fill="url(#soil)"/>
  <rect y="300" width="800" height="200" fill="url(#gravel)" opacity=".5"/>
  <rect y="292" width="800" height="12" fill="#6b8f3a"/>
  <path d="M300 300 L340 470 L560 470 L600 300 Z" fill="#5a3d22" opacity=".55"/>
  <rect x="330" y="402" width="240" height="44" rx="22" fill="url(#pipe)"/>
  <rect x="330" y="410" width="240" height="6" fill="#ffffff" opacity=".25"/>
  <circle cx="330" cy="424" r="22" fill="#4a525b"/>
  <circle cx="330" cy="424" r="15" fill="#2b3036"/>
  <!-- house with scaffolding -->
  <g>
    <rect x="70" y="170" width="170" height="130" fill="#f2efe9" stroke="#3b3b3b" stroke-width="3"/>
    <path d="M58 175 L155 105 L252 175 Z" fill="#c2492e" stroke="#3b3b3b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="95" y="200" width="36" height="36" fill="#9fd0ff" stroke="#3b3b3b" stroke-width="2.5"/>
    <rect x="178" y="200" width="36" height="36" fill="#9fd0ff" stroke="#3b3b3b" stroke-width="2.5"/>
    <rect x="137" y="244" width="34" height="56" fill="#7a4b2a" stroke="#3b3b3b" stroke-width="2.5"/>
    <g stroke="#e0a100" stroke-width="4">
      <line x1="60" y1="150" x2="60" y2="300"/>
      <line x1="250" y1="150" x2="250" y2="300"/>
      <line x1="56" y1="190" x2="254" y2="190"/>
      <line x1="56" y1="245" x2="254" y2="245"/>
    </g>
  </g>
  <!-- crane -->
  <g stroke="#f2a900" stroke-width="5" stroke-linecap="round">
    <line x1="660" y1="300" x2="660" y2="60"/>
    <line x1="560" y1="64" x2="760" y2="64"/>
    <line x1="660" y1="64" x2="560" y2="64"/>
  </g>
  <g stroke="#f2a900" stroke-width="2">
    <path d="M652 300 L668 280 L652 260 L668 240 L652 220 L668 200 L652 180 L668 160 L652 140 L668 120 L652 100 L668 80" fill="none"/>
  </g>
  <line x1="590" y1="64" x2="590" y2="170" stroke="#3b3b3b" stroke-width="2"/>
  <rect x="572" y="170" width="36" height="22" fill="#5d6670"/>
  <rect x="728" y="58" width="30" height="24" fill="#3b3b3b"/>
  <!-- excavator -->
  <g>
    <rect x="410" y="262" width="96" height="22" rx="11" fill="#2f2f2f"/>
    <circle cx="424" cy="273" r="8" fill="#555"/><circle cx="458" cy="273" r="8" fill="#555"/><circle cx="492" cy="273" r="8" fill="#555"/>
    <rect x="420" y="222" width="70" height="40" rx="6" fill="#f2c200" stroke="#3b3b3b" stroke-width="2.5"/>
    <rect x="456" y="228" width="26" height="22" rx="3" fill="#9fd0ff" stroke="#3b3b3b" stroke-width="2"/>
    <path d="M422 236 L372 200 L342 254" fill="none" stroke="#f2c200" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 248 L356 248 L350 272 L334 272 Z" fill="#3b3b3b"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="292" y="250" width="8" height="50" fill="#6b4a2a"/>
    <circle cx="296" cy="238" r="24" fill="#3f8f45"/>
    <rect x="752" y="256" width="7" height="44" fill="#6b4a2a"/>
    <circle cx="755" cy="244" r="20" fill="#4ea254"/>
  </g>
  <!-- labels -->
  <g font-size="14" font-weight="600" fill="#1f2328">
    <rect x="596" y="410" width="176" height="30" rx="15" fill="#ffffff" opacity=".92"/>
    <text x="684" y="430" text-anchor="middle">KS DN 150 · 1,2 %</text>
    <rect x="34" y="330" width="232" height="30" rx="15" fill="#ffffff" opacity=".92"/>
    <text x="150" y="350" text-anchor="middle">Lindenstraße 14 · Haltung S1–S2</text>
  </g>
</svg>
