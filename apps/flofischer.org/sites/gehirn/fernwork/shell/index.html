<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fernwork · Free file and everyday tools</title>
<link rel="icon" href="../kit/img/logo.svg" type="image/svg+xml">
<script src="../kit/theme-init.js"></script>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/components.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- Home (Revision 1): hero · drop area · tool search · Continue · category map (today's nav). Footer = legal links. -->
<main id="main">
  <div class="home">
    <section class="home-hero" aria-labelledby="home-h1">
      <h1 id="home-h1">Do anything with a file.</h1>
      <p class="home-hero__lede">Convert, view and edit files, or pick a tool below.</p>
      <div class="home-hero__box">
        <div class="fw-intake home-drop" id="home-drop" data-intake aria-label="Choose a file, or drop one here">
          <span class="fw-intake__icon" data-icon="upload" data-size="22"></span>
          <span class="home-drop__text">
            <span class="fw-intake__title"><span class="fw-pointer-copy">Drop a file here</span><span class="fw-touch-copy">Choose a file</span></span>
            <span class="fw-intake__sub">
              <span class="fw-intake__actions fw-pointer-copy"><button class="fw-btn fw-btn--sm" type="button" data-pick>Choose file</button></span>
              <span class="fw-pointer-copy">or paste <span class="fw-kbd-hint" data-kbd="mod+v"></span></span>
              <span class="fw-touch-copy">Photo, PDF, video, Word, Excel, CAD…</span>
            </span>
          </span>
        </div>
        <div class="fw-query home-search">
          <span data-icon="search" data-size="20"></span>
          <input class="fw-query__input" id="home-search" type="text" autocomplete="off" spellcheck="false"
            placeholder="Search tools, e.g. “merge pdf” or “lbs to kg”" aria-label="Search tools">
          <span class="fw-kbd-hint fw-hide-mobile" data-kbd="/" style="margin-right:8px"></span>
        </div>
      </div>
    </section>

    <section class="home-section" aria-labelledby="continue-h" id="continue-sec">
      <div class="home-section__head"><h2 class="home-section__title" id="continue-h">Continue</h2>
        <button class="fw-btn fw-btn--ghost fw-btn--sm home-section__aside" type="button" id="clear-recent">Clear</button></div>
      <div class="continue" id="continue"></div>
    </section>

    <section class="home-section" aria-labelledby="all-h">
      <div class="home-section__head"><h2 class="home-section__title" id="all-h">All tools</h2></div>
      <div id="map"></div>
    </section>
  </div>
</main>
<script type="module">
import { mountShell, icon, kbd, renderCatalog, getRecent, getLeaf, hrefFor, attachSearch, esc, openChooser, clearRecent, toast, $, $$ } from '../kit/shell.js';

mountShell({ archetype: 'home', rail: false, wide: true, searchInput: '#home-search',
  onFiles: (files) => openChooser(files) });  // home has no direct accept: every drop/pick goes to the action chooser
$$('[data-kbd]').forEach((el) => { el.innerHTML = kbd(el.dataset.kbd); });
$('#map').innerHTML = renderCatalog();

function renderContinue() {
  const r = getRecent().slice(0, 6);
  $('#continue').innerHTML = r.map((x) => { const l = getLeaf(x.leaf); return `<a class="continue__item" href="${hrefFor(l)}" data-leaf="${l.id}">
    <span class="continue__icon">${icon(l.icon, { size: 16 })}</span><span class="continue__text"><span class="continue__name">${esc(l.name)}</span>${x.file || x.note ? `<span class="continue__file">${esc(x.file || x.note)}</span>` : ''}</span></a>`; }).join('');
  $('#continue-sec').hidden = !r.length;
}
renderContinue();
$('#clear-recent').onclick = () => { const undo = clearRecent(); renderContinue(); toast('Recent cleared', { type: 'neutral', action: { label: 'Undo', onClick: () => { undo(); renderContinue(); } } }); };
attachSearch($('#home-search'));
if (matchMedia('(max-width: 767px)').matches) $('#home-search').placeholder = 'Search tools';
</script>
</body>
</html>
