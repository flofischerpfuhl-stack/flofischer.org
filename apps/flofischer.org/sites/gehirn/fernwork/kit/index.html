<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fernwork One kit · Style guide</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  .sg { width: 100%; max-width: 1480px; margin: 0 auto; padding: 32px var(--gutter) 0; }
  .sg-intro { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  .sg-intro h1 { font-size: var(--text-2xl); line-height: var(--lh-2xl); letter-spacing: var(--tracking-tighter); font-weight: 600; }
  .sg-intro p { color: var(--text-2); max-width: 720px; margin-top: 6px; }
  .sg-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 24px; }
  .sg-cols { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 0; border: 1px solid var(--border-subtle); border-radius: 16px; overflow: hidden; }
  .sg-col { background: var(--bg); color: var(--text-1); padding: 24px; min-width: 0; }
  .sg-col + .sg-col { border-left: 1px solid var(--border-subtle); }
  .sg-col__label { font-size: var(--text-xs); font-weight: 600; color: var(--text-3); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
  .sg-sec { padding: 0 0 28px; margin-bottom: 28px; border-bottom: 1px solid var(--border-subtle); }
  .sg-sec:last-child { border-bottom: 0; margin-bottom: 0; }
  .sg-sec h2 { font-size: var(--text-md); line-height: var(--lh-md); font-weight: 600; margin-bottom: 4px; scroll-margin-top: 80px; }
  .sg-sec > p { font-size: var(--text-sm); color: var(--text-3); margin-bottom: 16px; }
  .sg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .sg-sw { border: 1px solid var(--border-subtle); border-radius: 10px; overflow: hidden; font-size: var(--text-xs); }
  .sg-sw > div:first-child { height: 40px; }
  .sg-sw > div:last-child { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; color: var(--text-1); font-weight: 500; }
  .sg-sw code { font: 400 11px/14px var(--font-mono); color: var(--text-3); }
  .sg-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .sg-label { font-size: var(--text-xs); color: var(--text-3); margin: 14px 0 8px; font-weight: 500; }
  .sg-focus { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
  .sg-static { position: static !important; display: block; animation: none !important; transform: none !important; }
  .sg-static.fw-dialog, .sg-static.fw-cmd__panel { display: flex; flex-direction: column; width: 100%; max-width: 560px; }
  .sg-type div { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px dashed var(--border-subtle); }
  .sg-type code { width: 140px; flex: none; font: 400 var(--text-xs)/1 var(--font-mono); color: var(--text-3); }
  .sg-wbdemo { height: 360px; border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; }
  .sg-wbdemo .fw-workbench { height: 100%; }
  .sg-wbdemo .fw-wb-main { --_list: 0px; --_insp: 220px; }
  .sg-veil { position: relative; height: 380px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--veil); border: 1px solid var(--border-subtle); }
  @media (max-width: 1100px) { .sg-cols { --cols: 1; } .sg-col + .sg-col { border-left: 0; border-top: 1px solid var(--border-subtle); } }
</style>
</head>
<body>
<main id="main">
  <div class="sg">
    <div class="sg-intro">
      <div style="flex:1;min-width:280px">
        <h1>Fernwork One kit</h1>
        <p>Tokens, components and shell for every mockup. Light and dark render side by side; the app bar, rail, command bar (<span data-k="mod+k"></span>), drop veil (drag a file anywhere) and toasts on this page are live.</p>
      </div>
      <div class="fw-row-flex fw-wrap">
        <button class="fw-btn" type="button" id="demo-cmd"><span data-icon="search"></span>Command bar</button>
        <button class="fw-btn" type="button" id="demo-dialog">Dialog</button>
        <button class="fw-btn" type="button" id="demo-sheet">Sheet</button>
        <button class="fw-btn" type="button" id="demo-toast">Toast + Undo</button>
        <button class="fw-btn" type="button" id="demo-chooser">Drop chooser</button>
        <button class="fw-btn" type="button" id="demo-menu" aria-haspopup="menu" aria-expanded="false">Menu<span data-icon="chevron-down"></span></button>
      </div>
    </div>
    <nav class="sg-toc fw-chips" id="toc" aria-label="Sections"></nav>
    <div class="sg-cols">
      <div class="sg-col" data-theme="light"><div class="sg-col__label"><span data-icon="sun" data-size="12"></span>Light</div><div class="sg-body"></div></div>
      <div class="sg-col" data-theme="dark"><div class="sg-col__label"><span data-icon="moon" data-size="12"></span>Dark</div><div class="sg-body"></div></div>
    </div>
  </div>
</main>
<script type="module">
import { mountShell, icon, kbd, enhance, renderCatalog, toast, openDialog, openSheet, openMenu, openCommandBar, openChooser, loadSamples, $, $$ } from './shell.js';
mountShell({ archetype: 'instant', routing: 'auto', wide: true });
$$('[data-k]').forEach((e) => (e.innerHTML = kbd(e.dataset.k)));
const I = (n, s) => icon(n, { size: s || 16 });
const SECTIONS = [];
const sec = (id, title, note, html) => { SECTIONS.push([id, title]); return `<section class="sg-sec"><h2 id="${id}-%T">${title}</h2>${note ? `<p>${note}</p>` : ''}${html}</section>`; };
const sw = (v, label) => `<div class="sg-sw"><div style="background:var(${v})"></div><div><span>${label || v.replace('--', '')}</span><code class="sg-val" data-var="${v}"></code></div></div>`;

const html = [
sec('tokens', 'Colour roles', 'Every colour comes from a role token; tool CSS never hard-codes colours.', `
  <div class="sg-label">Surfaces & borders</div><div class="sg-swatches">${['--bg', '--surface-1', '--surface-2', '--surface-sunken', '--surface-overlay', '--border-subtle', '--border-strong'].map((v) => sw(v)).join('')}</div>
  <div class="sg-label">Text</div><div class="sg-swatches">${['--text-1', '--text-2', '--text-3', '--text-disabled'].map((v) => sw(v)).join('')}</div>
  <div class="sg-label">Accent & semantic</div><div class="sg-swatches">${['--accent-fill', '--accent-text', '--accent-subtle-bg', '--info', '--success', '--warning', '--danger'].map((v) => sw(v)).join('')}</div>
  <div class="sg-label">Series (charts, CVD-safe)</div><div class="sg-swatches">${[1, 2, 3, 4, 5, 6, 7, 8].map((i) => sw('--series-' + i)).join('')}</div>`),
sec('type', 'Type', 'Geist for UI, Geist Mono only for values, code, hashes and timecodes.', `<div class="sg-type">
  <div><code>display 48/52</code><span class="fw-t-display fw-num">152.4</span></div>
  <div><code>2xl 32/40</code><span class="fw-t-2xl">Do anything with a file</span></div>
  <div><code>xl 24/32 · H1</code><span class="fw-t-xl">Convert images</span></div>
  <div><code>lg 20/28</code><span class="fw-t-lg">Section title</span></div>

  <div><code>mono 13</code><span class="fw-mono fw-t-sm">e3b0c442 98fc1c14 9afbf4c8</span></div></div>`),

sec('choice', 'Choice controls', 'Toggles, checks, radios, sliders (value always shown), steppers.', `<div class="fw-stack" style="--gap:14px;max-width:520px">

$$('.sg-col').forEach((col) => { col.querySelector('.sg-body').innerHTML = html.replaceAll('%T', col.dataset.theme); enhance(col); });
$$('.sg-val').forEach((el) => { el.textContent = getComputedStyle(el.closest('.sg-col')).getPropertyValue(el.dataset.var).trim(); });
$('#toc').innerHTML = SECTIONS.map(([id, t]) => `<a class="fw-chip" href="#${id}-light">${t.split(' ·')[0]}</a>`).join('');
$('#demo-cmd').onclick = () => openCommandBar('2^10*3');
$('#demo-dialog').onclick = () => openDialog({ title: 'Discard edits to IMG_2041?', body: 'You changed brightness and cropped the photo. This can’t be undone.', actions: [{ label: 'Keep editing' }, { label: 'Discard', danger: true, onClick: () => toast('Edits discarded', { type: 'neutral', action: { label: 'Undo' } }) }] });
$('#demo-sheet').onclick = () => openSheet({ title: 'Settings', height: 'half', body: '<div class="fw-stack" style="--gap:16px"><label class="fw-toggle"><input type="checkbox" checked> Keep metadata</label><div class="fw-slider"><label class="fw-slider__label" for="sq">Quality</label><output class="fw-slider__value"></output><input id="sq" type="range" value="70" data-unit=" %"></div></div>' });
$('#demo-toast').onclick = () => toast('Image closed', { type: 'neutral', action: { label: 'Undo', onClick: () => toast('Restored IMG_2041.HEIC') } });
$('#demo-chooser').onclick = async () => openChooser(await loadSamples('report.docx'));
$('#demo-menu').onclick = (e) => openMenu(e.currentTarget, [{ group: 'Theme', items: [{ label: 'Light', icon: 'sun', checked: true }, { label: 'Dark', icon: 'moon', checked: false }] }, { group: '', items: [{ label: 'Keyboard shortcuts', icon: 'keyboard', kbd: '?' }, { label: 'Delete', icon: 'trash-2', danger: true }] }]);
