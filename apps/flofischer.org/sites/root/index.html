<head>
  <meta charset="UTF-8" />

    name="description"
    content="Flo Fischer — a freely rotatable floating-island diorama between Seele and Gehirn."

    data-description-de="Flo Fischer — ein frei drehbares Floating-Island-Diorama zwischen Seele und Gehirn."
  />
  <meta name="theme-color" content="#0c0b10" />
  <meta name="application-name" content="Flo Fischer" />

  <meta property="og:site_name" content="Flo Fischer" />

  <title>Flo Fischer</title>
  <script src="/shared/language.js"></script>
  <link rel="stylesheet" href="/shared/hub/hub.css" />
  <link rel="stylesheet" href="/shared/hub/diorama.css?v=18" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="preload" href="/shared/hub/art/diorama-preview.webp?v=18" as="image" type="image/webp" fetchpriority="high" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <link rel="modulepreload" href="/shared/hub/diorama.js?v=18" />
</head>
<body class="realm-diorama" data-title-en="Flo Fischer" data-title-de="Flo Fischer">
  <canvas id="diorama-world" aria-label="Freely rotatable floating island between Seele and Gehirn"></canvas>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="diorama-vignette" aria-hidden="true"></div>
  <div class="diorama-loader" data-diorama-loader role="status" aria-live="polite">
    <div class="loader-scene" aria-hidden="true">
      <span class="loader-layer loader-layer--back"></span>
      <span class="loader-layer loader-layer--island"></span>
      <span class="loader-layer loader-layer--front"></span>
    </div>
    <div class="diorama-loader-panel">
      <span class="diorama-loader-spinner" aria-hidden="true"></span>
      <p class="diorama-loader-title">
        <span data-lang-copy="en">Building the floating island</span>
        <span data-lang-copy="de">Floating Island wird aufgebaut</span>
      </p>
      <div
        class="diorama-loader-track"
        role="progressbar"
        aria-label="Diorama loading progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        data-loader-progress
      ><span data-loader-progress-fill></span></div>
      <p class="diorama-loader-value"><span data-loader-progress-value>0</span>%</p>
    </div>
  </div>
  <div class="fade-veil" data-fade></div>

  <a class="skip-link" href="#diorama-fallback">
    <span data-lang-copy="en">Skip to links</span>
    <span data-lang-copy="de">Zu den Links</span>
  </a>

  <header class="hud" data-hud>
    <a class="hud-mark" href="/" data-local="/__root/">flo fischer</a>
    <p class="hud-zone" data-zone>Seele · Gehirn</p>
    <nav class="hud-nav" aria-label="Site" id="diorama-fallback">
      <a href="https://seele.flofischer.org/" data-local="/__seele/">Seele</a>
      <a href="https://gehirn.flofischer.org/" data-local="/__gehirn/">Gehirn</a>
      <div class="language-switch" role="group" aria-label="Language / Sprache">
        <button type="button" data-language-button="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language-button="de" aria-pressed="false">DE</button>
      </div>
    </nav>
  </header>

  <p class="hint diorama-hint" data-hint>
    <span data-lang-copy="en">Drag · scroll/pinch to zoom · click a sign</span>
    <span data-lang-copy="de">Ziehen · scrollen/aufziehen · Schild anklicken</span>
  </p>

  <noscript>
    <div class="noscript">
      <p>Seele · Gehirn</p>
      <p><a href="https://seele.flofischer.org/">seele.flofischer.org</a></p>
      <p><a href="https://gehirn.flofischer.org/">gehirn.flofischer.org</a></p>
    </div>
  </noscript>

  <script type="module" src="/shared/hub/diorama.js?v=18"></script>
  <script src="/shared/pwa.js" defer></script>
</body>
</html>
