<!DOCTYPE html>
<html lang="en" data-language="en" data-pwa-site="root">
<head>
  <meta charset="UTF-8" />

  <meta
    name="description"
    content="Flo Fischer — a freely rotatable Three.js diorama between Seele and Gehirn."

  />

  <meta name="twitter:image" content="https://flofischer.org/social-preview.jpg" />

  <script>
    try {
      var language = localStorage.getItem("ff-language");
      if (language === "de") {
        document.documentElement.lang = "de";
        document.documentElement.dataset.language = "de";
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/shared/hub/hub.css" />
  <link rel="stylesheet" href="/shared/hub/diorama.css?v=10" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }

<body class="realm-diorama" data-title-en="Flo Fischer — 3D Diorama" data-title-de="Flo Fischer — 3D-Diorama">
  <canvas id="diorama-world" aria-label="Freely rotatable diorama between Seele and Gehirn"></canvas>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="diorama-vignette" aria-hidden="true"></div>
  <div class="diorama-loader" data-diorama-loader aria-hidden="true"></div>
  <div class="fade-veil" data-fade></div>

  <a class="skip-link" href="#diorama-fallback">
    <span data-lang-copy="en">Skip to links</span>
    <span data-lang-copy="de">Zu den Links</span>
  </a>

  <header class="hud" data-hud>
    <a class="hud-mark" href="/" data-local="/__root/">flo fischer</a>
    <p class="hud-zone" data-zone>Seele · Gehirn</p>
    <nav class="hud-nav" aria-label="Site" id="diorama-fallback">
      <a href="https://seele.flofischer.org/" data-local="/__seele/">Seele</a>
      <a href="https://gehirn.flofischer.org/" data-local="/__gehirn/">Gehirn</a>
      <a class="mode-link" href="/" data-local="/__root/" aria-label="01 — open the immersive first-person version" title="Immersive Hub">01</a>
      <div class="language-switch" role="group" aria-label="Language / Sprache">
        <button type="button" data-language-button="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language-button="de" aria-pressed="false">DE</button>
      </div>
    </nav>
  </header>

  <p class="hint diorama-hint" data-hint>
    <span data-lang-copy="en">Drag to orbit · scroll to zoom · click a sign to enter</span>
    <span data-lang-copy="de">Ziehen zum Drehen · scrollen zum Zoomen · Schild anklicken</span>
  </p>

  <noscript>
    <div class="noscript">
      <p>Seele · Gehirn</p>
      <p><a href="https://seele.flofischer.org/">seele.flofischer.org</a></p>
      <p><a href="https://gehirn.flofischer.org/">gehirn.flofischer.org</a></p>
    </div>
  </noscript>

  <script type="module" src="/shared/hub/diorama.js?v=10"></script>
  <script src="/shared/pwa.js" defer></script>
</body>
</html>
